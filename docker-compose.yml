version: '3.8'
services:
  frontend:
    image: node:18-alpine
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    ports:
      - "5173:5173"
    environment:
      - HOST=0.0.0.0
    command: sh -c "npm install && npm run dev"
    networks:
      - universe-network

  backend:
    image: node:18-alpine
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    ports:
      - "3001:3001"
    environment:
      - FRONTEND_URL=*
      - HOST=0.0.0.0
    command: sh -c "npm install && npm run dev"
    depends_on:
      - frontend
    networks:
      - universe-network

networks:
  universe-network:
    driver: bridge
