version: '3.8'
services:
  backend:
    image: node:18-alpine
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - FRONTEND_URL=*
      - HOST=0.0.0.0
    command: sh -c "npm install && npm start"
    networks:
      - universe-network

  frontend:
    image: node:18-alpine
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    ports:
      - "5173:5173"
    environment:
      - HOST=0.0.0.0
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
    networks:
      - universe-network

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - universe-network
    restart: unless-stopped

networks:
  universe-network:
    driver: bridge
